<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ali Zouhair — Chef de projet IT et Développeur Full Stack PHP">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#5A7A5E" opacity="0.18"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A7A5E"/>
      <stop offset="1" stop-color="#3F5A43"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#F6F7F4"/>
  <rect x="760" y="0" width="440" height="320" fill="url(#grid)"/>

  <!-- Panneau de droite -->
  <path d="M842 0 H1182 a18 18 0 0 1 18 18 V302 a18 18 0 0 1 -18 18 H842 a24 24 0 0 1 -24 -24 V24 a24 24 0 0 1 24 -24 Z" fill="url(#panel)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- Bloc gauche -->
    <text x="64" y="104" font-size="64" font-weight="800" fill="#2B2B2B" letter-spacing="1">ALI ZOUHAIR</text>
    <rect x="66" y="128" width="96" height="4" rx="2" fill="#5A7A5E"/>
    <text x="64" y="178" font-size="26" font-weight="500" fill="#3A3A3A">Chef de projet IT &amp; Développeur Full Stack PHP</text>
    <text x="64" y="214" font-size="18" fill="#6B6B6B">5 ans en développement web · Applications métiers, CMS et ERP</text>

    <!-- Puces techno -->
    <g font-size="16" font-weight="600" fill="#3F5A43">
      <rect x="64" y="244" width="92" height="34" rx="17" fill="none" stroke="#5A7A5E" stroke-width="1.5"/>
      <text x="110" y="266" text-anchor="middle">Laravel</text>
      <rect x="168" y="244" width="104" height="34" rx="17" fill="none" stroke="#5A7A5E" stroke-width="1.5"/>
      <text x="220" y="266" text-anchor="middle">Symfony</text>
      <rect x="284" y="244" width="120" height="34" rx="17" fill="none" stroke="#5A7A5E" stroke-width="1.5"/>
      <text x="344" y="266" text-anchor="middle">WordPress</text>
      <rect x="416" y="244" width="88" height="34" rx="17" fill="none" stroke="#5A7A5E" stroke-width="1.5"/>
      <text x="460" y="266" text-anchor="middle">Drupal</text>
      <rect x="516" y="244" width="112" height="34" rx="17" fill="none" stroke="#5A7A5E" stroke-width="1.5"/>
      <text x="572" y="266" text-anchor="middle">API REST</text>
      <rect x="640" y="244" width="124" height="34" rx="17" fill="none" stroke="#5A7A5E" stroke-width="1.5"/>
      <text x="702" y="266" text-anchor="middle">Agile Scrum</text>
    </g>

    <!-- Panneau droit : fenêtre de code -->
    <g transform="translate(872 58)">
      <rect width="296" height="204" rx="12" fill="#FFFFFF" opacity="0.08"/>
      <circle cx="20" cy="20" r="5" fill="#FFFFFF" opacity="0.55"/>
      <circle cx="38" cy="20" r="5" fill="#FFFFFF" opacity="0.35"/>
      <circle cx="56" cy="20" r="5" fill="#FFFFFF" opacity="0.2"/>
      <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15">
        <text x="20" y="62" fill="#CFE0D1">$developer = [</text>
        <text x="40" y="90" fill="#FFFFFF"><tspan fill="#CFE0D1">'goal'</tspan> =&gt; 'Tech Lead',</text>
        <text x="40" y="116" fill="#FFFFFF"><tspan fill="#CFE0D1">'stack'</tspan> =&gt; 'PHP',</text>
        <text x="40" y="142" fill="#FFFFFF"><tspan fill="#CFE0D1">'next'</tspan> =&gt; 'Cloud',</text>
        <text x="20" y="170" fill="#CFE0D1">];</text>
      </g>
    </g>
    <text x="1020" y="298" text-anchor="middle" font-size="15" fill="#E4ECE5" letter-spacing="0.5">Marrakech · Casablanca</text>
  </g>
</svg>
